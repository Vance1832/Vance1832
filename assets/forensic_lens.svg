<svg xmlns="http://www.w3.org/2000/svg" width="760" height="348" viewBox="0 0 760 348" role="img" aria-labelledby="title description">
<title id="title">Khant Zayar — Forensic Lens</title>
<desc id="description">An illustrative forensic learning terminal: a violet scan highlights the bytes for defend. Khant Zayar is a third-year Computer Science student at Rangsit University in Bangkok, following a Blue Team and SOC Analyst path. CompTIA Security+ is in progress. This is a learning simulation, not professional incident-response experience.</desc>
<defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#0b111b"/><stop offset="1" stop-color="#151322"/></linearGradient>
<linearGradient id="beam"><stop stop-color="#bda8ee" stop-opacity="0"/><stop offset="1" stop-color="#bda8ee" stop-opacity=".2"/></linearGradient>
<clipPath id="sample"><rect x="486" y="116" width="228" height="149"/></clipPath>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#dce6ef}
.muted{fill:#a3b0c2}.violet{fill:#c1abea}.good{fill:#92cdb1}
.scan{animation:scan 12s linear infinite}.pattern{animation:pattern 12s ease-in-out infinite}
.log1{animation:log1 12s ease-in-out infinite}.log2{animation:log2 12s ease-in-out infinite}.log3{animation:log3 12s ease-in-out infinite}
.cursor{animation:blink 1.2s step-end infinite}
@keyframes scan{0%{transform:translateX(0);opacity:0}8%{opacity:1}72%{transform:translateX(260px);opacity:1}85%,100%{transform:translateX(260px);opacity:0}}
@keyframes pattern{0%,22%,100%{opacity:.35}40%,84%{opacity:1}}
@keyframes log1{0%,100%{opacity:.4}10%,88%{opacity:1}}
@keyframes log2{0%,24%,100%{opacity:.4}37%,88%{opacity:1}}
@keyframes log3{0%,49%,100%{opacity:.4}63%,88%{opacity:1}}
@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.scan{display:none;animation:none}.pattern,.log1,.log2,.log3,.cursor{animation:none;opacity:1}}
</style>
</defs>
<rect x=".5" y=".5" width="759" height="347" rx="12" fill="url(#surface)" stroke="#354151"/>
<path d="M12 1H748Q759 1 759 12V37H1V12Q1 1 12 1" fill="#171e2b"/>
<path d="M1 37H759M1 315H759" stroke="#303646"/>
<circle cx="21" cy="19" r="4" fill="#ca8c88"/><circle cx="37" cy="19" r="4" fill="#d0b67d"/><circle cx="53" cy="19" r="4" fill="#87b99e"/>
<text x="76" y="23" font-size="12" class="muted">kz@lab: ~/evidence</text>
<text x="734" y="23" text-anchor="end" font-size="11" letter-spacing="1" class="muted">LEARNING SIMULATION</text>
<text x="30" y="79" font-size="15"><tspan class="violet">$</tspan> xxd sample.bin</text><rect x="203" y="65" width="8" height="16" fill="#c1abea" class="cursor"/>
<text x="29" y="129" font-size="35" letter-spacing="-1">KHANT ZAYAR</text>
<text x="30" y="157" font-size="15" class="violet">Blue Team / SOC Analyst path</text>
<text x="30" y="186" font-size="13" class="muted">Third-year CS · Rangsit University</text>
<text x="30" y="206" font-size="13" class="muted">Bangkok, Thailand</text>
<g font-size="13"><text x="30" y="244" class="muted log1">[+] inspect the evidence</text><text x="30" y="265" class="muted log2">[+] connect the details</text><text x="30" y="286" class="good log3">[+] document the findings</text></g>
