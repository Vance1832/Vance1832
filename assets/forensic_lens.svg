<text x="486" y="91" font-size="12" letter-spacing="1.1" class="muted">SAMPLE / HEX VIEW</text><path d="M486 104H714" stroke="#30334a"/>
<g font-size="15" text-anchor="middle">
<text x="501" y="133" class="muted">4b<tspan x="540">5a</tspan><tspan x="579">20</tspan><tspan x="618">6c</tspan><tspan x="657">61</tspan><tspan x="696">62</tspan></text>
<text x="501" y="159" class="muted">00<tspan x="540">17</tspan><tspan x="579">a3</tspan><tspan x="618">09</tspan><tspan x="657">6e</tspan><tspan x="696">2f</tspan></text>
<g class="pattern"><rect x="487" y="170" width="224" height="22" rx="3" fill="#664b84" opacity=".35"/><text x="501" y="185" class="violet">64<tspan x="540">65</tspan><tspan x="579">66</tspan><tspan x="618">65</tspan><tspan x="657">6e</tspan><tspan x="696">64</tspan></text></g>
<text x="501" y="211" class="muted">2e<tspan x="540">30</tspan><tspan x="579">01</tspan><tspan x="618">8c</tspan><tspan x="657">7f</tspan><tspan x="696">02</tspan></text>
<text x="501" y="237" class="muted">73<tspan x="540">74</tspan><tspan x="579">75</tspan><tspan x="618">64</tspan><tspan x="657">79</tspan><tspan x="696">00</tspan></text>
</g>
<g clip-path="url(#sample)"><g class="scan"><rect x="452" y="115" width="34" height="132" fill="url(#beam)"/><path d="M486 115V247" stroke="#c1abea" stroke-opacity=".8"/></g></g>
<g class="pattern"><circle cx="491" cy="272" r="3" fill="#bda8ee"/><text x="504" y="276" class="violet" font-size="12">PATTERN LOCATED</text></g>
<text x="21" y="336" font-size="12" style="fill:#dbbd80">SECURITY+ / IN PROGRESS</text>
<text x="739" y="336" text-anchor="end" font-size="11" class="muted">small details. better questions.</text>
