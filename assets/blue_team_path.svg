<svg xmlns="http://www.w3.org/2000/svg" width="560" height="568" viewBox="0 0 560 568" role="img" aria-labelledby="title"><title id="title">Security learning path: foundations, detection, incident response, SOC Analyst, Security Analyst, then offensive security exploration</title><style>text{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;fill:#e6edf3;font-size:14px}.muted{fill:#9aa4b2}.blue{fill:#79c0ff}.amber{fill:#e3b341}.green{fill:#7ee787}</style><rect x=".5" y=".5" width="559" height="567" rx="10" fill="#0d1117" stroke="#30363d"/><path d="M10 1H550Q559 1 559 10V38H1V10Q1 1 10 1" fill="#161b22"/><text x="20" y="25" class="muted" style="font-size:12px" xml:space="preserve">~/roadmap/security_path</text><text x="25" y="70" class="muted" style="font-size:12px" xml:space="preserve">A learning direction, not an employment history.</text><circle cx="37" cy="105" r="14" fill="#161b22" stroke="#30363d"/><text x="29" y="110" class="blue" style="font-size:12px" xml:space="preserve">01</text><text x="66" y="110" class="blue" style="font-size:16px" xml:space="preserve">FOUNDATIONS</text><text x="66" y="135" class="muted" style="font-size:12px" xml:space="preserve">Networks · Linux · Python · Security basics</text><path d="M37 122v45" stroke="#30363d" stroke-dasharray="3 4"/><circle cx="37" cy="183" r="14" fill="#161b22" stroke="#30363d"/><text x="29" y="188" class="blue" style="font-size:12px" xml:space="preserve">02</text><text x="66" y="188" class="blue" style="font-size:16px" xml:space="preserve">DETECTION</text><text x="66" y="213" class="muted" style="font-size:12px" xml:space="preserve">Logs · SIEM · Alert triage · Network analysis</text><path d="M37 200v45" stroke="#30363d" stroke-dasharray="3 4"/><circle cx="37" cy="261" r="14" fill="#161b22" stroke="#30363d"/><text x="29" y="266" class="blue" style="font-size:12px" xml:space="preserve">03</text><text x="66" y="266" class="blue" style="font-size:16px" xml:space="preserve">INCIDENT RESPONSE</text><text x="66" y="291" class="muted" style="font-size:12px" xml:space="preserve">Investigate · Contain · Recover · Report</text><path d="M37 278v45" stroke="#30363d" stroke-dasharray="3 4"/><circle cx="37" cy="339" r="14" fill="#161b22" stroke="#e3b341"/><text x="29" y="344" class="amber" style="font-size:12px" xml:space="preserve">04</text><text x="66" y="344" class="amber" style="font-size:16px" xml:space="preserve">BLUE TEAM / SOC ANALYST</text><text x="66" y="369" class="muted" style="font-size:12px" xml:space="preserve">Immediate role goal · Summer 2027 internship</text><path d="M37 356v45" stroke="#30363d" stroke-dasharray="3 4"/><circle cx="37" cy="417" r="14" fill="#161b22" stroke="#30363d"/><text x="29" y="422" class="blue" style="font-size:12px" xml:space="preserve">05</text><text x="66" y="422" class="blue" style="font-size:16px" xml:space="preserve">SECURITY ANALYST</text><text x="66" y="447" class="muted" style="font-size:12px" xml:space="preserve">Build broader defensive security experience</text><path d="M37 434v45" stroke="#30363d" stroke-dasharray="3 4"/><circle cx="37" cy="495" r="14" fill="#161b22" stroke="#30363d"/><text x="29" y="500" class="blue" style="font-size:12px" xml:space="preserve">06</text><text x="66" y="500" class="blue" style="font-size:16px" xml:space="preserve">RED TEAM / OFFENSIVE SECURITY</text><text x="66" y="525" class="muted" style="font-size:12px" xml:space="preserve">Long-term exploration</text></svg>
