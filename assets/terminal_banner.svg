<title id="title">Khant Zayar — Blue Team field notes</title>
<desc id="desc">Computer Science student at Rangsit University. Goal: Blue Team and SOC analysis. Also building software with Python, Django and Next.js. Decorative terminal commands type slowly over 30 seconds and then remain visible.</desc>
<defs>
<style>
text { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; }
.base { fill:#e6edf3; font-size:14px; } .muted { fill:#8b949e; } .green { fill:#7ee787; } .blue { fill:#79c0ff; } .amber { fill:#e3b341; } .purple { fill:#d2a8ff; }
.type { animation: typing 3s steps(26,end) both; }
.command1 { animation-delay:2s; } .command2 { animation-delay:9s; animation-duration:4s; } .command3 { animation-delay:22s; animation-duration:4s; }
.output { animation: appear .5s both; }
.o1 { animation-delay:5.5s; } .o2 { animation-delay:7s; } .p2 { animation-delay:8.5s; }
.o3 { animation-delay:13.5s; } .o4 { animation-delay:15s; } .o5 { animation-delay:16.5s; } .o6 { animation-delay:18s; }
.p3 { animation-delay:21s; } .o7 { animation-delay:27s; } .o8 { animation-delay:28.5s; } .end { animation-delay:30s; }
.cursor { animation: blink 1.4s step-end infinite; }
@keyframes typing { from { clip-path:inset(0 100% 0 0); } to { clip-path:inset(0 0 0 0); } }
@keyframes appear { from { opacity:0; } to { opacity:1; } }
@keyframes blink { 50% { opacity:0; } }
@media (prefers-reduced-motion:reduce) { .type,.output,.cursor { animation:none; } }
</style>
</defs>
