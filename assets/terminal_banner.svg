<svg xmlns="http://www.w3.org/2000/svg" width="780" height="390" viewBox="0 0 780 390" role="img" aria-labelledby="title desc">
  <title id="title">Khant Zayar secure terminal</title>
  <desc id="desc">Animated terminal showing Khant Zayar's cybersecurity and software engineering career paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="0.55" stop-color="#071625"/><stop offset="1" stop-color="#0c1c2d"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.2"/><stop offset="0.5" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399" stop-opacity="0.2"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .muted { fill: #64748b; } .cyan { fill: #22d3ee; } .green { fill: #34d399; } .white { fill: #cbd5e1; }
      .line { opacity: 0; animation: reveal 12s infinite; }
      .l1 { animation-delay: 0s; } .l2 { animation-delay: 0.8s; } .l3 { animation-delay: 1.6s; } .l4 { animation-delay: 2.4s; } .l5 { animation-delay: 3.2s; } .l6 { animation-delay: 4s; } .l7 { animation-delay: 4.8s; }
      .cursor { animation: blink 0.9s step-end infinite; } .scan { animation: scan 5s linear infinite; }
      @keyframes reveal { 0%, 5% { opacity: 0; transform: translateY(4px); } 10%, 92% { opacity: 1; transform: translateY(0); } 98%, 100% { opacity: 0; } }
      @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
      @keyframes scan { from { transform: translateY(-30px); } to { transform: translateY(390px); } }
    </style>
  </defs>
  <rect x="1" y="1" width="778" height="388" rx="16" fill="url(#bg)" stroke="#164e63" stroke-width="2"/>
  <rect x="1" y="1" width="778" height="48" rx="16" fill="#07111f"/><rect x="1" y="35" width="778" height="14" fill="#07111f"/>
  <circle cx="25" cy="24" r="6" fill="#fb7185"/><circle cx="45" cy="24" r="6" fill="#fbbf24"/><circle cx="65" cy="24" r="6" fill="#34d399"/>
  <text x="390" y="29" text-anchor="middle" class="mono muted" font-size="13">secure_shell — khant@github</text>
  <rect x="0" y="47" width="780" height="2" fill="url(#edge)" filter="url(#glow)"/>
  <g class="mono" font-size="17">
    <g class="line l1"><text x="30" y="82" class="green">khant@github:~$</text><text x="205" y="82" class="white"> whoami</text></g>
    <g class="line l2"><text x="30" y="115" class="cyan" font-size="25" font-weight="700">KHANT ZAYAR</text><text x="210" y="115" class="muted">// CS STUDENT · BANGKOK</text></g>
    <g class="line l3"><text x="30" y="156" class="green">khant@github:~$</text><text x="205" y="156" class="white"> cat career.config</text></g>
    <g class="line l4"><text x="48" y="189" class="cyan">PRIMARY</text><text x="145" y="189" class="white">= CYBERSECURITY</text><text x="394" y="189" class="muted"># defend · detect · respond</text></g>
    <g class="line l5"><text x="48" y="222" class="cyan">SECONDARY</text><text x="165" y="222" class="white">= SOFTWARE_ENGINEERING</text><text x="445" y="222" class="muted"># design · build · ship</text></g>
    <g class="line l6"><text x="30" y="263" class="green">khant@github:~$</text><text x="205" y="263" class="white"> ./build_the_future.sh</text></g>
    <g class="line l7"><text x="48" y="300" class="green">[ OK ]</text><text x="118" y="300" class="white">learning</text><text x="235" y="300" class="green">[ OK ]</text><text x="305" y="300" class="white">building</text><text x="420" y="300" class="cyan">[ ACTIVE ]</text><text x="530" y="300" class="white">securing systems</text></g>
    <g class="line l7"><text x="30" y="348" class="green">khant@github:~$</text><rect x="205" y="331" width="10" height="21" rx="1" class="cursor" fill="#22d3ee"/></g>
  </g>
  <rect x="0" y="0" width="780" height="30" fill="#22d3ee" opacity="0.025" class="scan"/>
</svg>

