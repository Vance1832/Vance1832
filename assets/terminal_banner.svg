<svg xmlns="http://www.w3.org/2000/svg" width="760" height="632" viewBox="0 0 760 632" role="img" aria-labelledby="title desc">
  <title id="title">KZ — Blue Team defense simulation</title>
  <desc id="desc">An illustrative SOC learning scene: suspicious packets travel from a threat signature toward a KZ shield. A scan detects the event, telemetry is analyzed, and the packets are contained. Khant Zayar is a third-year Computer Science student at Rangsit University in Bangkok on the Blue Team and SOC Analyst path, studying CompTIA Security+. This is artwork, not a claim of professional incident-response experience.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#243244" stroke-width=".6"/></pattern>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102e44"/><stop offset="1" stop-color="#101b2b"/></linearGradient>
    <linearGradient id="scanFill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#72d6e8" stop-opacity="0"/><stop offset="1" stop-color="#72d6e8" stop-opacity=".16"/></linearGradient>
    <clipPath id="scene"><rect x="24" y="88" width="712" height="244" rx="6"/></clipPath>
    <style>
      text { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#dce5ef; }
      .muted { fill:#8c9bab; } .cyan { fill:#72d6e8; } .red { fill:#df8a80; } .green { fill:#8cd6ad; } .amber { fill:#e7bf76; }
      .draw { stroke-dasharray:650;animation:shield 14s ease-in-out infinite; }
      .threat { animation:threat 14s ease-in-out infinite; }
      .scan { animation:scan 14s linear infinite; }
      .packet-a { animation:packetA 14s linear infinite; }
      .packet-b { animation:packetB 14s linear infinite; }
      .packet-c { animation:packetC 14s linear infinite; }
      .impact { transform-origin:344px 199px;animation:impact 14s ease-out infinite; }
      .detect { animation:detect 14s ease-in-out infinite; }
      .analyze { animation:analyze 14s ease-in-out infinite; }
      .contain { animation:contain 14s ease-in-out infinite; }
      .log1 { animation:log1 14s ease-in-out infinite; }
      .log2 { animation:log2 14s ease-in-out infinite; }
      .log3 { animation:log3 14s ease-in-out infinite; }
      .log4 { animation:log4 14s ease-in-out infinite; }
      .identity { animation:identity 14s ease-in-out infinite; }
      .cursor { animation:blink 1.2s step-end infinite; }
      .boot { animation:boot 14s ease-in-out infinite; }
      @keyframes boot { 0%,100%{opacity:.35} 12%,94%{opacity:1} }
      @keyframes shield { 0%,23%,100%{stroke-dashoffset:650;opacity:.2} 38%,93%{stroke-dashoffset:0;opacity:1} 98%{stroke-dashoffset:0;opacity:.2} }
      @keyframes threat { 0%,10%,100%{opacity:.2} 20%,65%{opacity:1} 72%,93%{opacity:.25} }
      @keyframes scan { 0%,27%,100%{opacity:0;transform:translateY(0)} 30%{opacity:1;transform:translateY(0)} 46%{opacity:1;transform:translateY(124px)} 49%,99%{opacity:0;transform:translateY(124px)} }
      @keyframes packetA { 0%,15%{opacity:0;transform:translateX(0)} 16%{opacity:1;transform:translateX(0)} 28%{opacity:1;transform:translateX(164px)} 29%,100%{opacity:0;transform:translateX(164px)} }
      @keyframes packetB { 0%,28%{opacity:0;transform:translateX(0)} 29%{opacity:1;transform:translateX(0)} 43%{opacity:1;transform:translateX(164px)} 44%,100%{opacity:0;transform:translateX(164px)} }
      @keyframes packetC { 0%,44%{opacity:0;transform:translateX(0)} 45%{opacity:1;transform:translateX(0)} 59%{opacity:1;transform:translateX(164px)} 61%,100%{opacity:0;transform:translateX(164px)} }
      @keyframes impact { 0%,58%,100%{opacity:0;transform:scale(.5)} 60%{opacity:.8;transform:scale(1)} 67%,99%{opacity:0;transform:scale(2)} }
      @keyframes detect { 0%,31%,100%{opacity:.25} 36%,94%{opacity:1} }
      @keyframes analyze { 0%,44%,100%{opacity:.25} 49%,94%{opacity:1} }
      @keyframes contain { 0%,62%,100%{opacity:.25} 68%,94%{opacity:1} }
      @keyframes log1 { 0%,29%,100%{opacity:0} 33%,94%{opacity:1} }
      @keyframes log2 { 0%,35%,100%{opacity:0} 39%,94%{opacity:1} }
      @keyframes log3 { 0%,48%,100%{opacity:0} 52%,94%{opacity:1} }
      @keyframes log4 { 0%,66%,100%{opacity:0} 70%,94%{opacity:1} }
      @keyframes identity { 0%,68%,100%{opacity:.38} 76%,94%{opacity:1} }
      @keyframes blink { 50%{opacity:0} }
      @media(prefers-reduced-motion:reduce) { .draw,.threat,.scan,.packet-a,.packet-b,.packet-c,.impact,.detect,.analyze,.contain,.log1,.log2,.log3,.log4,.identity,.cursor,.boot{animation:none}.scan,.packet-a,.packet-b,.packet-c,.impact{display:none} }
    </style>
  </defs>
  <rect x=".5" y=".5" width="759" height="631" rx="12" fill="#0d131c" stroke="#303c4b"/>
  <path d="M12 1H748Q759 1 759 12V37H1V12Q1 1 12 1" fill="#18212d"/>
  <circle cx="21" cy="19" r="5" fill="#df8a80"/><circle cx="39" cy="19" r="5" fill="#e7bf76"/><circle cx="57" cy="19" r="5" fill="#8cd6ad"/>
  <text x="380" y="23" text-anchor="middle" class="muted" font-size="11">kz / defense-lab</text>
  <g class="boot"><text x="26" y="69" class="cyan" font-size="20" font-weight="700">SOC://KZ</text><rect x="138" y="54" width="8" height="17" fill="#72d6e8" class="cursor"/></g>
  <text x="734" y="66" text-anchor="end" class="muted" font-size="10">ILLUSTRATIVE DEFENSE SIMULATION</text>
  <g clip-path="url(#scene)">
    <rect x="24" y="88" width="712" height="244" fill="url(#grid)" opacity=".4"/>
    <text x="64" y="117" class="muted" font-size="10" letter-spacing="1.5">THREAT SIGNATURE</text>
    <g class="threat" fill="#251e24" stroke="#df8a80" stroke-width="2" stroke-linejoin="round">
      <path d="M96 153Q96 134 126 134Q156 134 156 153V176Q154 188 143 191V211H110V191Q96 186 96 176Z"/>
      <path d="M105 158l15 3-3 12h-11ZM133 161l14-3-1 15h-11Z" fill="#df8a80" stroke="none"/>
      <path d="M126 174l-5 10h10Z" fill="#df8a80" stroke="none"/>
      <path d="M119 198v13m13-13v13"/>
    </g>
    <text x="126" y="244" text-anchor="middle" class="red" font-size="11">suspicious event</text>
    <path d="M178 199H337" stroke="#495564" stroke-dasharray="3 6"/>
    <text x="257" y="181" text-anchor="middle" class="muted" font-size="10">telemetry</text>
    <g fill="#df8a80">
      <rect x="175" y="195" width="8" height="8" rx="2" class="packet-a"/>
      <rect x="175" y="195" width="8" height="8" rx="2" class="packet-b"/>
      <rect x="175" y="195" width="8" height="8" rx="2" class="packet-c"/>
    </g>
    <path d="M416 109L488 138V206Q488 260 416 299Q344 260 344 206V138Z" fill="url(#shieldFill)" stroke="#2b5066" stroke-width="2"/>
    <path d="M416 109L488 138V206Q488 260 416 299Q344 260 344 206V138Z" fill="none" stroke="#72d6e8" stroke-width="2.5" class="draw"/>
    <path d="M416 124L474 148V206Q474 248 416 283Q358 248 358 206V148Z" fill="none" stroke="#72d6e8" stroke-opacity=".22"/>
    <text x="416" y="210" text-anchor="middle" font-size="43" font-weight="700" class="cyan">KZ</text>
    <text x="416" y="236" text-anchor="middle" font-size="10" letter-spacing="2" class="muted">BLUE TEAM</text>
    <circle cx="344" cy="199" r="11" fill="none" stroke="#8cd6ad" stroke-width="2" class="impact"/>
    <g class="scan"><rect x="84" y="120" width="84" height="25" fill="url(#scanFill)"/><path d="M84 145H168" stroke="#72d6e8" stroke-width="1.5"/></g>
    <path d="M491 199H537M537 166V242M537 166H552M537 204H552M537 242H552" fill="none" stroke="#344253"/>
    <g class="detect"><circle cx="565" cy="166" r="4" fill="#e7bf76"/><text x="579" y="171" font-size="12" class="amber">DETECT</text></g>
    <g class="analyze"><circle cx="565" cy="204" r="4" fill="#72d6e8"/><text x="579" y="209" font-size="12" class="cyan">ANALYZE</text></g>
    <g class="contain"><circle cx="565" cy="242" r="4" fill="#8cd6ad"/><text x="579" y="247" font-size="12" class="green">CONTAIN</text></g>
    <text x="416" y="324" text-anchor="middle" font-size="10" class="muted">OBSERVE / INVESTIGATE / RESPOND</text>
  </g>
  <path d="M26 350H734" stroke="#283444"/>
  <g font-size="13">
    <text x="28" y="377" class="log1"><tspan class="muted">[lab:01] </tspan>telemetry received</text>
    <text x="28" y="400" class="log2"><tspan class="amber">[detect] </tspan>anomalous activity detected</text>
    <text x="28" y="423" class="log3"><tspan class="cyan">[analyze]</tspan> telemetry correlated · signature analyzed</text>
    <text x="28" y="446" class="log4"><tspan class="green">[respond]</tspan> simulated threat contained</text>
  </g>
  <path d="M26 470H734" stroke="#283444"/>
  <g class="identity">
    <text x="28" y="509" font-family="Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="2">KHANT ZAYAR</text>
    <text x="28" y="535" class="cyan" font-size="13">BLUE TEAM / SOC ANALYST PATH</text>
    <text x="28" y="558" class="muted" font-size="12">Third-year CS · Rangsit University · Bangkok</text>
    <rect x="498" y="491" width="235" height="57" rx="6" fill="#251f17" stroke="#66573c" stroke-dasharray="4 3"/>
    <text x="615" y="514" text-anchor="middle" class="amber" font-size="13">SECURITY+ // IN PROGRESS</text>
    <text x="615" y="534" text-anchor="middle" class="muted" font-size="11">CompTIA Security+ candidate</text>
  </g>
  <text x="28" y="601" class="muted" font-size="12">&gt; understand how things break. build them better.<tspan class="cursor">_</tspan></text>
</svg>
