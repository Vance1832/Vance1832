<svg xmlns="http://www.w3.org/2000/svg" width="780" height="188" viewBox="0 0 780 188" role="img" aria-labelledby="title desc">
  <title id="title">Khant Zayar career tracks</title>
  <desc id="desc">Cybersecurity as the primary track and software engineering as the secondary track.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071625"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .pulse { transform-origin: center; animation: pulse 2s ease-in-out infinite; } .pulse2 { transform-origin: center; animation: pulse 2s ease-in-out 0.5s infinite; }
      .flow { stroke-dasharray: 6 8; animation: dash 8s linear infinite; }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } } @keyframes dash { to { stroke-dashoffset: -140; } }
    </style>
  </defs>
  <rect x="1" y="1" width="778" height="186" rx="14" fill="#020617" stroke="#164e63"/>
  <path d="M54 94 H726" stroke="#164e63" stroke-width="2" class="flow"/>
  <rect x="28" y="25" width="344" height="138" rx="12" fill="url(#card)" stroke="#22d3ee"/>
  <circle cx="57" cy="52" r="7" fill="#22d3ee" filter="url(#glow)" class="pulse"/>
  <text x="77" y="58" fill="#22d3ee" class="mono" font-size="17" font-weight="700">PRIMARY // CYBERSECURITY</text>
  <text x="52" y="94" fill="#cbd5e1" class="mono" font-size="14">SOC · NETWORK DEFENSE · PENTESTING</text>
  <text x="52" y="124" fill="#64748b" class="mono" font-size="13">STATUS: ACTIVE LEARNING</text>
  <rect x="52" y="140" width="285" height="5" rx="2.5" fill="#0e7490"/><rect x="52" y="140" width="196" height="5" rx="2.5" fill="#22d3ee"/>
  <rect x="408" y="25" width="344" height="138" rx="12" fill="url(#card)" stroke="#34d399" stroke-opacity=".75"/>
  <circle cx="437" cy="52" r="7" fill="#34d399" filter="url(#glow)" class="pulse2"/>
  <text x="457" y="58" fill="#34d399" class="mono" font-size="16" font-weight="700">SECONDARY // SOFTWARE ENG</text>
  <text x="432" y="94" fill="#cbd5e1" class="mono" font-size="14">FULL STACK · APIS · DATABASES</text>
  <text x="432" y="124" fill="#64748b" class="mono" font-size="13">STATUS: BUILDING IN PUBLIC</text>
  <rect x="432" y="140" width="285" height="5" rx="2.5" fill="#065f46"/><rect x="432" y="140" width="170" height="5" rx="2.5" fill="#34d399"/>
</svg>

